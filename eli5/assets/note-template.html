<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <script>document.documentElement.classList.add('js');try{const t=localStorage.getItem('od-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false,ignoredTags:['script','noscript','style','textarea','pre','code']})"></script>
  <style>
    /* ---------- 토큰 ---------- */
    :root {
      color-scheme: light;
      --bg: #ffffff; --surface: #f7f8fa; --ink: #111111; --ink-2: #6b7280; --line: #d9dee7;
      --accent: #1677ff; --accent-ink: #1b64da; --btn-bg: #1b64da; --on-btn: #ffffff;
      --warn: #b54708; --prof: #6941c6; --supp: #067647; --danger: #d92d20;
      --scroll: #c9d0db; --scroll-hover: #9aa3b2;
      --font: 'Pretendard', system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      --fs-title: clamp(28px, 6vw, 36px); --fs-h3: clamp(26px, 5.4vw, 32px); --fs-layer: 19px; --fs-lead: 22px; --fs-body: 17px; --fs-sub: 15px; --fs-small: 14px; --fs-label: 13px; --fs-fig: 12px;
      --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
      --radius: 8px; --measure: 680px; --tap: 48px; --btn-min: 160px;
      --dur: 220ms; --dur-exit: 150ms; --ease-out: cubic-bezier(.2, .8, .2, 1);
      /* 예전 조각이 참조할 수 있는 이름 */
      --surface-2: var(--surface); --accent-soft: var(--surface); --warn-soft: var(--surface);
      --prof-soft: var(--surface); --supp-soft: var(--surface); --eli5: var(--accent-ink); --eli5-soft: var(--surface);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #17171c; --surface: #212128; --ink: #f2f4f6; --ink-2: #a3abb8; --line: #34353d;
        --accent: #3182f6; --accent-ink: #6ea4ff; --btn-bg: #1b64da; --on-btn: #ffffff;
        --warn: #f5a15c; --prof: #b69cff; --supp: #5fd39a; --danger: #ff6b61;
        --scroll: #3f414b; --scroll-hover: #5b5e6a;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #17171c; --surface: #212128; --ink: #f2f4f6; --ink-2: #a3abb8; --line: #34353d;
      --accent: #3182f6; --accent-ink: #6ea4ff; --btn-bg: #1b64da; --on-btn: #ffffff;
      --warn: #f5a15c; --prof: #b69cff; --supp: #5fd39a; --danger: #ff6b61;
      --scroll: #3f414b; --scroll-hover: #5b5e6a;
    }

    /* ---------- 기본 ---------- */
    * { box-sizing: border-box; }
    html { scroll-padding-top: 72px; -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      background: var(--bg); color: var(--ink); font-family: var(--font); font-size: var(--fs-body); line-height: 1.7; word-break: keep-all; overflow-wrap: anywhere; }
    a { color: var(--accent-ink); text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    [hidden] { display: none !important; }

    /* ---------- 상단 바 ---------- */
    .topbar { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
    .topbar-inner { max-width: var(--measure); margin: 0 auto; padding: var(--s2) var(--s4); display: flex; align-items: center; gap: var(--s3); min-height: 56px; }
    .brand { flex: 1 1 auto; min-width: 0; font-size: var(--fs-body); font-weight: 700; white-space: nowrap; }
    .text-btn { flex: none; min-height: 44px; min-width: 44px; padding: 0 var(--s3); border: 0; border-radius: var(--radius);
      background: transparent; color: var(--ink); font: 600 var(--fs-small)/1 var(--font); cursor: pointer; }
    .bar { height: 2px; background: var(--line); overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform var(--dur) var(--ease-out); }

    /* ---------- 본문 ---------- */
    main { flex: 1 0 auto; width: 100%; max-width: var(--measure); margin: 0 auto; padding: var(--s6) var(--s5) var(--s7); }
    .hero h1 { font-size: var(--fs-title); line-height: 1.3; margin: 0 0 var(--s3); letter-spacing: -0.02em; }
    .hero p { color: var(--ink-2); margin: 0; }
    section { margin-top: var(--s7); }
    section > h2 { font-size: 22px; line-height: 1.4; margin: 0 0 var(--s4); }
    .topic { padding: var(--s6) 0; border-top: 1px solid var(--line); }
    .topic h3 { margin: 0 0 var(--s2); font-size: var(--fs-h3); font-weight: 800; line-height: 1.3; letter-spacing: -0.02em; }
    .tags { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s5); }
    .tag { font-size: var(--fs-label); line-height: 1.5; padding: 2px var(--s2); border-radius: 6px; background: var(--surface); color: var(--ink-2); white-space: nowrap; }

    /* 레이어: 배경 없이 라벨과 구분선으로 나눈다 */
    .layer { margin-top: var(--s5); padding-top: var(--s5); border-top: 1px solid var(--line); }
    .layer.eli5 { margin-top: 0; padding-top: 0; border-top: 0; }
    .layer > :first-child { margin-top: 0; }
    .layer > :last-child { margin-bottom: 0; }
    .layer-title { display: block; font-size: var(--fs-layer); font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; color: var(--ink); margin-bottom: var(--s3); }
    .layer.eli5 .layer-title { color: var(--accent-ink); }
    .layer.eli5 .lead { font-size: var(--fs-lead); font-weight: 700; line-height: 1.5; letter-spacing: -0.01em; margin: 0 0 var(--s4); }
    /* 정확히 말하면: 본문 크기 그대로, 굵은 첫머리만 진하게 */
    .layer.formal b { font-weight: 700; color: var(--ink); }
    /* 교수님 말씀 · 주의: 보조 정보는 한 단계 작게 */
    .layer.prof, .layer.warn, .layer.listen { font-size: var(--fs-sub); line-height: 1.7; }
    .layer.prof blockquote { font-size: var(--fs-sub); }
    .layer.prof .layer-title { color: var(--prof); }
    .layer.warn, .layer.listen { background: var(--surface); border-top: 0; border-radius: var(--radius); padding: var(--s4); }
    .layer.warn .layer-title { color: var(--warn); font-size: var(--fs-body); }
    .layer.listen .layer-title { color: var(--accent-ink); font-size: var(--fs-body); }
    .layer.supp .badge.supp { margin-bottom: var(--s2); }
    .badge { display: inline-block; font-size: var(--fs-label); font-weight: 600; line-height: 1.5; padding: 2px var(--s2); border-radius: 6px; background: var(--surface); color: var(--ink-2); }
    .badge.supp { color: var(--supp); }
    .badge.exam { color: var(--warn); margin-right: var(--s1); }
    blockquote { margin: var(--s3) 0; padding: 0 0 0 var(--s3); border-left: 2px solid var(--line); color: var(--ink-2); }
    ol.steps { padding-left: 1.4em; }
    ol.steps li { margin: var(--s2) 0; }

    /* 그림 · 수식 · 표 */
    .figure { margin: var(--s4) 0; text-align: center; }
    .figure svg { width: 100%; height: auto; max-width: 560px; color: var(--ink); }
    .figure img { max-width: 100%; height: auto; }
    .figure figcaption { font-size: var(--fs-small); color: var(--ink-2); margin-top: var(--s1); }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: var(--s1) 0; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: var(--fs-small); }
    th, td { border-bottom: 1px solid var(--line); padding: var(--s2); text-align: left; vertical-align: top; }
    th { color: var(--ink-2); font-weight: 600; }
    td:first-child, th:first-child { min-width: 6em; }

    /* 위젯 */
    .widget { background: var(--surface); border-radius: var(--radius); padding: var(--s4); margin: var(--s5) 0; }
    .widget h4 { margin: 0 0 var(--s1); font-size: var(--fs-layer); line-height: 1.4; }
    .widget-help { font-size: var(--fs-small); color: var(--ink-2); margin: 0 0 var(--s3); }
    .controls { display: grid; gap: var(--s2); grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-bottom: var(--s2); font-size: var(--fs-small); }
    .controls label { display: flex; align-items: center; gap: var(--s2); min-height: 44px; }
    .controls input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
    .widget svg { width: 100%; height: auto; background: var(--bg); border-radius: var(--radius); }
    .readout { font-size: var(--fs-small); margin-top: var(--s2); }
    .legend { font-size: var(--fs-label); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: var(--s3); }
    .sw { display: inline-block; width: 14px; height: 4px; vertical-align: middle; margin-right: var(--s1); border-radius: 2px; }
    .sw.truth { background: var(--ink-2); } .sw.fit { background: var(--accent); } .sw.train { background: var(--accent); height: 10px; width: 10px; border-radius: 50%; }
    .sw.test { background: var(--warn); height: 10px; width: 10px; border-radius: 50%; } .sw.like { background: var(--accent); } .sw.prior { background: var(--prof); } .sw.post { background: var(--supp); }
    .axis { stroke: var(--line); stroke-width: 1.5; }
    .tick { fill: var(--ink-2); font-size: 11px; }
    .plot-truth { fill: none; stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .plot-fit { fill: none; stroke: var(--accent); stroke-width: 2.5; }
    .pt-train { fill: var(--accent); }
    .pt-test { fill: var(--warn); }
    .plot-like { fill: none; stroke: var(--accent); stroke-width: 2; }
    .plot-prior { fill: none; stroke: var(--prof); stroke-width: 2; stroke-dasharray: 6 4; }
    .plot-post { fill: none; stroke: var(--supp); stroke-width: 3; }
    .mark-ml { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; }
    .mark-map { stroke: var(--supp); stroke-width: 1.5; stroke-dasharray: 3 3; }
    .fig-ink { stroke: currentColor; fill: none; stroke-width: 2; }
    .fig-accent { stroke: var(--accent); fill: none; stroke-width: 2.5; }
    .fig-danger { stroke: var(--danger); fill: none; stroke-width: 2.5; }
    .fig-dot { fill: var(--accent); }
    .fig-text { fill: currentColor; font-size: 13px; font-family: inherit; }
    .fig-muted { fill: var(--ink-2); font-size: var(--fs-fig); font-family: inherit; }

    footer { width: 100%; max-width: var(--measure); margin: 0 auto; padding: 0 var(--s5) var(--s6); color: var(--ink-2); font-size: var(--fs-small); }

    /* ---------- 하단 이동 바 ---------- */
    .pager { position: sticky; bottom: 0; z-index: 10; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .pager-inner { max-width: var(--measure); margin: 0 auto; padding: var(--s3) var(--s4); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--s3); }
    .pager-count { font-size: var(--fs-small); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: center; min-width: 4em; }
    .btn { min-height: var(--tap); min-width: var(--btn-min); padding: 0 var(--s6); border-radius: var(--radius); border: 0; font: 700 var(--fs-body)/1 var(--font); cursor: pointer; white-space: nowrap;
      transition: background-color 150ms ease-out, opacity 150ms ease-out; }
    .btn-ghost { justify-self: start; background: var(--surface); color: var(--ink); }
    .btn-primary { justify-self: end; background: var(--btn-bg); color: var(--on-btn); }
    .btn:disabled { opacity: .4; cursor: default; }
    @media (hover: hover) {
      .text-btn:hover, .btn-ghost:not(:disabled):hover { background: var(--line); }
      .btn-primary:not(:disabled):hover { box-shadow: inset 0 0 0 100px rgba(0, 0, 0, .14); }
    }

    /* ---------- 목차 시트 ---------- */
    .sheet { width: min(100%, var(--measure)); max-width: 100%; max-height: 80dvh; margin: auto auto 0; padding: 0; border: 0;
      border-radius: 16px 16px 0 0; background: var(--bg); color: var(--ink); }
    .sheet::backdrop { background: rgba(0, 0, 0, .4); }
    .sheet-inner { padding: var(--s4) var(--s5) calc(var(--s5) + env(safe-area-inset-bottom)); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s2); }
    .sheet-head h2 { margin: 0; font-size: var(--fs-lead); }
    .toc { display: flex; flex-direction: column; }
    .toc > a, .toc-group > a { display: block; padding: var(--s3) 0 var(--s1); font-size: var(--fs-label); font-weight: 600; color: var(--ink-2); text-decoration: none; }
    .toc-list { list-style: none; margin: 0 0 var(--s2); padding: 0; }
    .toc-list a { display: flex; align-items: center; gap: var(--s3); min-height: var(--tap); padding: var(--s2) var(--s3); margin: 0 calc(-1 * var(--s3));
      border-radius: var(--radius); color: var(--ink); text-decoration: none; line-height: 1.4; }
    .toc-list a[aria-current="true"] { background: var(--surface); font-weight: 700; color: var(--accent-ink); }
    .toc-list .toc-title { flex: 1 1 0; min-width: 0; }
    @media (hover: hover) { .toc-list a:hover { background: var(--surface); } }

    /* ---------- 한 화면에 하나씩 (JS가 켤 때만) ---------- */
    html:not(.js) .pager, html:not(.js) #toc-open { display: none; }
    html:not(.js) .sheet { display: block; position: static; width: 100%; max-height: none; margin: 0 auto; border-radius: 0; border-bottom: 1px solid var(--line); }
    html:not(.js) .sheet-close { display: none; }
    .js main > .hero:not(.is-current), .js main > section:not(.is-on), .js .screen:not(.is-current) { display: none; }
    .js main > section { margin-top: 0; }
    .js main > section > h2 { font-size: var(--fs-small); font-weight: 600; color: var(--accent-ink); margin: 0 0 var(--s2); }
    .js .topic { padding: 0; border-top: 0; }
    .js .hero { padding-top: 12vh; }
    .js footer { display: none; }
    .js body.at-end footer { display: block; }
    .screen.enter-next { animation: enter-next var(--dur) var(--ease-out); }
    .screen.enter-prev { animation: enter-prev var(--dur) var(--ease-out); }
    @keyframes enter-next { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
    @keyframes enter-prev { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .screen.enter-next, .screen.enter-prev { animation: none; }
      .bar > span, .btn { transition: none; }
    }
    @media (max-width: 480px) {
      main { padding: var(--s5) var(--s4) var(--s6); }
      footer { padding: 0 var(--s4) var(--s5); }
      .btn { min-width: 120px; padding: 0 var(--s5); }
    }
    @media print {
      .topbar, .pager, .sheet { display: none !important; }
      .js main > .hero, .js main > section, .js .screen, .js footer { display: block !important; }
    }

    /* ---------- 좌우 패널 (drawer) ---------- */
    :root { --panel-l: clamp(240px, 18vw, 320px); --panel-r-min: 320px; --panel-r-max: 720px; --scrollbar: 16px; --drawer-l: 304px; --drawer-r: 360px; --fs-panel: 16px; --scrim: rgba(0, 0, 0, .4); }
    body { height: 100vh; height: 100dvh; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
    .topbar-inner { max-width: none; padding: var(--s2) var(--s3); gap: var(--s2); }
    .panel-toggle { display: inline-flex; align-items: center; gap: var(--s1); padding: 0 var(--s2); }
    .panel-toggle svg { flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .panel-toggle .strip { fill: transparent; stroke: none; transition: fill 150ms ease-out; }
    .panel-toggle[aria-expanded="true"] { color: var(--accent-ink); }
    .panel-toggle[aria-expanded="true"] .strip { fill: currentColor; }
    .theme-toggle { display: inline-flex; align-items: center; justify-content: center; padding: 0; }
    .theme-toggle svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .theme-toggle .i-sun { display: none; }
    :root[data-theme="dark"] .theme-toggle .i-sun { display: block; }
    :root[data-theme="dark"] .theme-toggle .i-moon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .theme-toggle .i-sun { display: block; }
      :root:not([data-theme="light"]) .theme-toggle .i-moon { display: none; }
    }

    .layout { display: grid; grid-template-columns: auto minmax(320px, 1fr) auto; min-height: 0; }
    .content { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scroll-padding-top: var(--s4); }
    .panel { position: relative; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-size: var(--fs-panel); line-height: 1.6; }
    .panel-left { grid-column: 1; border-right: 1px solid var(--line); }
    .content { grid-column: 2; }
    .panel-right { grid-column: 3; border-left: 1px solid var(--line); }
    .panel-inner { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--s4) var(--s4) var(--s6); }
    .content::-webkit-scrollbar, .panel-inner::-webkit-scrollbar { width: 8px; }
    .content::-webkit-scrollbar-track, .panel-inner::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb, .panel-inner::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 8px; border: 2px solid var(--bg); }
    .content::-webkit-scrollbar-thumb:hover, .panel-inner::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); }
    @supports (scrollbar-color: auto) { .content, .panel-inner { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; } }
    .panel-resize { display: none; }
    .panel-head { display: flex; align-items: center; gap: var(--s2); min-height: 44px; margin-bottom: var(--s2); }
    .panel-head h2 { flex: 1 1 0; min-width: 0; margin: 0; font-size: var(--fs-lead); line-height: 1.4; }
    .panel-sub { margin: 0 0 var(--s4); font-size: var(--fs-layer); font-weight: 700; line-height: 1.4; letter-spacing: -0.01em; }
    .panel-empty { margin: 0; color: var(--ink-2); }
    .panel-label { display: block; margin: var(--s5) 0 var(--s2); font-size: var(--fs-label); font-weight: 600; color: var(--ink-2); }

    /* 진행 상태 */
    .panel-meta { margin: 0 0 var(--s2); font-size: var(--fs-small); color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .panel-meta b { color: var(--ink); }
    .progress { height: 4px; margin-bottom: var(--s3); border-radius: 2px; background: var(--line); overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); transition: transform var(--dur) var(--ease-out); }
    .panel .toc-list a { margin: 0 calc(-1 * var(--s2)); padding: var(--s2); font-size: var(--fs-panel); }
    .toc-mark { flex: none; display: block; width: 20px; height: 20px; color: var(--ink-2); }
    .toc-mark svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .toc-mark.is-done { color: var(--accent-ink); }

    /* 복습문제: 원문 · 힌트 · 풀이 */
    .aid details:last-of-type { border-bottom: 1px solid var(--line); }
    .aid details.original > summary { font-size: var(--fs-panel); }
    .solved-btn { display: flex; align-items: center; justify-content: center; gap: var(--s2); width: 100%; min-height: var(--tap); margin-top: var(--s5); padding: 0 var(--s4);
      border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--ink); font: 700 var(--fs-panel)/1.2 var(--font); cursor: pointer; }
    .solved-btn svg { flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .solved-btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); }

    /* 정리노트: 페이지 요약 */
    .sum-supp { margin-top: var(--s4); }
    .sum-lead { margin: 0; font-size: var(--fs-body); font-weight: 700; line-height: 1.6; }
    .eq-list { list-style: none; margin: 0; padding: 0; }
    .eq-list li { padding: var(--s2) 0; border-bottom: 1px solid var(--line); }
    .eq-list li:first-child { padding-top: 0; }
    .eq-name { display: block; font-size: var(--fs-label); font-weight: 600; color: var(--ink-2); }
    .eq-list .katex-display { margin: var(--s1) 0 0; text-align: left; }
    .eq-list .katex-display > .katex { text-align: left; }
    .terms { margin: 0; }
    .terms dt { font-size: var(--fs-panel); font-weight: 700; margin-top: var(--s4); }
    .terms dt:first-child { margin-top: 0; }
    .terms dd { margin: var(--s1) 0 0; font-size: var(--fs-sub); line-height: 1.6; color: var(--ink-2); }
    .flow { margin: 0; padding-left: 1.4em; font-size: var(--fs-sub); }
    .flow li { margin: var(--s2) 0; }

    @media (hover: hover) { .solved-btn:hover { background: var(--surface); } }

    /* 넓은 화면: 본문 옆에 붙는 패널 */
    @media (min-width: 1024px) {
      .layout { --l: var(--panel-l-user, var(--panel-l)); }
      .layout[data-left="closed"] { --l: 0px; }
      .panel-left { width: var(--l); }
      /* 기본값: 왼쪽 패널과 본문 폭을 뺀 나머지를 오른쪽 패널이 차지 → 본문 옆 빈 여백이 생기지 않는다 */
      .panel-right { width: var(--panel-r-user, clamp(var(--panel-r-min), calc(100vw - var(--l) - var(--measure) - var(--scrollbar)), var(--panel-r-max))); }
      .panel-resize { display: block; position: absolute; top: 0; bottom: 0; z-index: 2; width: 12px; padding: 0; border: 0; background: transparent; cursor: col-resize; touch-action: none; }
      .panel-left .panel-resize { right: 0; }
      .panel-right .panel-resize { left: 0; }
      .panel-resize::after { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); opacity: 0; transition: opacity 150ms ease-out; }
      .panel-left .panel-resize::after { right: 0; }
      .panel-right .panel-resize::after { left: 0; }
      .panel-resize:focus-visible { outline: none; }
      .panel-resize:focus-visible::after, .is-resizing .panel-resize:active::after { opacity: 1; }
      @media (hover: hover) { .panel-resize:hover::after { opacity: 1; } }
      body.is-resizing { cursor: col-resize; user-select: none; }
      .layout[data-left="closed"] .panel-left, .layout[data-right="closed"] .panel-right { display: none; }
      .panel.is-shown { animation: panel-fade var(--dur) var(--ease-out); }
      .scrim, .panel-close { display: none; }
    }
    @keyframes panel-fade { from { opacity: 0; } to { opacity: 1; } }

    /* 좁은 화면: 가장자리에서 밀려 나오는 drawer */
    @media (max-width: 1023.98px) {
      .panel { position: fixed; top: 0; bottom: 0; z-index: 40; visibility: hidden;
        transition: transform var(--dur-exit) ease-in, visibility 0s linear var(--dur-exit); }
      .panel-left { left: 0; width: min(var(--drawer-l), 88vw); transform: translateX(-100%); }
      .panel-right { right: 0; width: min(var(--drawer-r), 88vw); transform: translateX(100%); }
      .panel.is-open { visibility: visible; transform: none; transition: transform var(--dur) var(--ease-out); }
      .panel-inner { padding-top: calc(var(--s3) + env(safe-area-inset-top)); padding-bottom: calc(var(--s6) + env(safe-area-inset-bottom)); }
      .scrim { position: fixed; inset: 0; z-index: 35; background: var(--scrim); opacity: 0; visibility: hidden;
        transition: opacity var(--dur-exit) ease-in, visibility 0s linear var(--dur-exit); }
      .scrim.is-on { opacity: 1; visibility: visible; transition: opacity var(--dur) var(--ease-out); }
      html:not(.js) .panel-left { display: none; }
    }
    @media (max-width: 480px) { .panel-toggle { padding: 0 var(--s1); } }
    html:not(.js) .panel-toggle, html:not(.js) .panel-right, html:not(.js) .scrim { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .panel, .panel.is-open, .scrim, .scrim.is-on, .progress > span, .panel-toggle .strip { transition: none; }
      .panel.is-shown { animation: none; }
      .panel-resize::after { transition: none; }
    }
    @media print {
      body { display: block; height: auto; overflow: visible; }
      .layout { display: block; }
      .content { overflow: visible; }
      .panel, .scrim { display: none !important; }
    }
  </style>

{{SCRIPTS}}
  <script id="theme-ui">
    (function () {
      const root = document.documentElement;
      const btn = document.getElementById('theme-toggle');
      const sysDark = matchMedia('(prefers-color-scheme: dark)');
      const KEY = 'od-theme';
      const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : sysDark.matches;
      function label() {
        const next = isDark() ? '라이트 모드로 전환' : '다크 모드로 전환';
        btn.setAttribute('aria-label', next);
        btn.title = next;
      }
      btn.addEventListener('click', () => {
        const t = isDark() ? 'light' : 'dark';
        // 시스템 설정과 같아지면 저장을 지워 다시 시스템을 따른다
        if ((t === 'dark') === sysDark.matches) { delete root.dataset.theme; try { localStorage.removeItem(KEY); } catch (e) {} }
        else { root.dataset.theme = t; try { localStorage.setItem(KEY, t); } catch (e) { /* 저장 불가: 이번 방문에만 유지 */ } }
        label();
      });
      sysDark.addEventListener('change', label);
      window.addEventListener('storage', (e) => {
        if (e.key !== KEY) return;
        if (e.newValue === 'light' || e.newValue === 'dark') root.dataset.theme = e.newValue; else delete root.dataset.theme;
        label();
      });
      label();
    })();
  </script>
  <script id="panels-ui">
    (function () {
      const body = document.body;
      const layout = document.querySelector('.layout');
      const kind = body.dataset.panels;
      const panels = { left: document.getElementById('panel-left'), right: document.getElementById('panel-right') };
      const toggles = { left: document.getElementById('toggle-left'), right: document.getElementById('toggle-right') };
      const scrim = document.getElementById('panel-scrim');
      const blockers = [document.querySelector('.topbar'), document.querySelector('.content'), document.querySelector('.pager')];
      const wideMq = matchMedia('(min-width: 1024px)');
      const roomyMq = matchMedia('(min-width: 1280px)');
      const store = {
        get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
        set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가: 이번 방문에만 유지 */ } }
      };
      // 푼 기록은 탭(세션) 단위로만 유지: 뒤로가기·새로고침엔 남고, 창을 닫고 다시 열면 초기화
      const tabStore = {
        get(k, d) { try { const v = sessionStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
        set(k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가: 이번 방문에만 유지 */ } }
      };
      const PREF = 'od-panels:' + kind;
      // 팩마다 문제·토픽 id가 p1, s1-…로 겹치므로 진행 기록은 기간별로 나눈다
      const RANGE = body.dataset.range || '';
      const ICON_TODO = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>';
      const ICON_DONE = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 10"/></svg>';
      let overlay = null;

      // ---------- 열고 닫기 ----------
      function docked() {
        const pref = store.get(PREF, {});
        return { left: pref.left ?? true, right: pref.right ?? roomyMq.matches };
      }
      function sync() {
        const wide = wideMq.matches;
        const d = docked();
        ['left', 'right'].forEach((side) => {
          const open = wide ? d[side] : overlay === side;
          const p = panels[side];
          layout.dataset[side] = open ? 'open' : 'closed';
          p.classList.toggle('is-open', !wide && open);
          p.inert = !open;
          if (!wide && open) { p.setAttribute('role', 'dialog'); p.setAttribute('aria-modal', 'true'); }
          else { p.removeAttribute('role'); p.removeAttribute('aria-modal'); }
          toggles[side].setAttribute('aria-expanded', String(open));
        });
        const drawer = !wide && overlay !== null;
        scrim.classList.toggle('is-on', drawer);
        body.classList.toggle('drawer-open', drawer);
        blockers.forEach((el) => { el.inert = drawer; });
      }
      function openDrawer(side) {
        overlay = side;
        sync();
        requestAnimationFrame(() => panels[side].querySelector('[data-panel-close]').focus());
      }
      function closeDrawer(refocus) {
        if (overlay === null) return;
        const side = overlay;
        overlay = null;
        sync();
        if (refocus) toggles[side].focus();
      }
      function toggle(side) {
        if (wideMq.matches) {
          const d = docked();
          d[side] = !d[side];
          store.set(PREF, d);
          sync();
          if (d[side]) { const p = panels[side]; p.classList.remove('is-shown'); void p.offsetWidth; p.classList.add('is-shown'); }
        } else if (overlay === side) closeDrawer(true);
        else openDrawer(side);
      }

      toggles.left.addEventListener('click', () => toggle('left'));
      toggles.right.addEventListener('click', () => toggle('right'));
      scrim.addEventListener('click', () => closeDrawer(true));
      document.querySelectorAll('[data-panel-close]').forEach((b) => b.addEventListener('click', () => closeDrawer(true)));
      panels.left.addEventListener('click', (e) => { if (e.target.closest('.toc a')) closeDrawer(false); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay !== null) { e.preventDefault(); closeDrawer(true); } });

      // ---------- 패널 너비: 기본은 화면 폭에 맞춰 자동, 경계를 끌면 직접 조절 ----------
      const WIDTH = { left: { min: 220, max: 480, prop: '--panel-l-user' }, right: { min: 280, max: 720, prop: '--panel-r-user' } };
      function applyWidths() {
        const w = store.get(PREF + ':w', {});
        ['left', 'right'].forEach((side) => {
          if (w[side]) layout.style.setProperty(WIDTH[side].prop, w[side] + 'px');
          else layout.style.removeProperty(WIDTH[side].prop);
        });
      }
      function maxFor(side) {
        const other = side === 'left' ? panels.right : panels.left;
        const otherW = layout.dataset[side === 'left' ? 'right' : 'left'] === 'open' ? other.getBoundingClientRect().width : 0;
        return Math.max(WIDTH[side].min, Math.min(WIDTH[side].max, window.innerWidth - otherW - 400));
      }
      function setWidth(side, px, save) {
        const v = Math.round(Math.min(Math.max(px, WIDTH[side].min), maxFor(side)));
        layout.style.setProperty(WIDTH[side].prop, v + 'px');
        panels[side].querySelector('.panel-resize').setAttribute('aria-valuenow', String(v));
        if (save) { const w = store.get(PREF + ':w', {}); w[side] = v; store.set(PREF + ':w', w); }
      }
      function resetWidth(side) {
        const w = store.get(PREF + ':w', {});
        delete w[side];
        store.set(PREF + ':w', w);
        layout.style.removeProperty(WIDTH[side].prop);
      }
      document.querySelectorAll('.panel-resize').forEach((handle) => {
        const side = handle.dataset.side;
        const dir = side === 'left' ? 1 : -1;
        handle.setAttribute('aria-valuemin', String(WIDTH[side].min));
        handle.setAttribute('aria-valuemax', String(WIDTH[side].max));
        handle.addEventListener('pointerdown', (e) => {
          if (!wideMq.matches || e.button !== 0) return;
          e.preventDefault();
          const startX = e.clientX;
          const startW = panels[side].getBoundingClientRect().width;
          handle.setPointerCapture(e.pointerId);
          body.classList.add('is-resizing');
          const move = (ev) => setWidth(side, startW + dir * (ev.clientX - startX), false);
          const up = () => {
            handle.removeEventListener('pointermove', move);
            handle.removeEventListener('pointerup', up);
            handle.removeEventListener('pointercancel', up);
            body.classList.remove('is-resizing');
            setWidth(side, panels[side].getBoundingClientRect().width, true);
          };
          handle.addEventListener('pointermove', move);
          handle.addEventListener('pointerup', up);
          handle.addEventListener('pointercancel', up);
        });
        handle.addEventListener('dblclick', () => resetWidth(side));
        handle.addEventListener('keydown', (e) => {
          const step = e.shiftKey ? 64 : 16;
          const cur = panels[side].getBoundingClientRect().width;
          if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            e.preventDefault();
            e.stopPropagation();
            setWidth(side, cur + (e.key === 'ArrowRight' ? step : -step) * dir, true);
          } else if (e.key === 'Home') { e.preventDefault(); resetWidth(side); }
        });
      });
      applyWidths();
      const onMq = () => { overlay = null; sync(); };
      wideMq.addEventListener('change', onMq);
      roomyMq.addEventListener('change', onMq);

      // ---------- 목차의 진행 표시 ----------
      const progressN = document.getElementById('progress-n');
      const progressBar = document.getElementById('progress-bar');
      const progressTotal = document.getElementById('progress-total');
      function markToc(done, total, doneLabel) {
        panels.left.querySelectorAll('.toc-list a').forEach((a) => {
          const id = decodeURIComponent(a.getAttribute('href').slice(1));
          let mark = a.querySelector('.toc-mark');
          if (!mark) {
            mark = document.createElement('span');
            mark.className = 'toc-mark';
            mark.setAttribute('aria-hidden', 'true');
            const state = document.createElement('span');
            state.className = 'sr-only toc-state';
            a.append(mark, state);
          }
          const isDone = done.has(id);
          mark.classList.toggle('is-done', isDone);
          mark.innerHTML = isDone ? ICON_DONE : ICON_TODO;
          a.querySelector('.toc-state').textContent = isDone ? ' (' + doneLabel + ')' : '';
        });
        progressN.textContent = String(done.size);
        progressTotal.textContent = String(total);
        progressBar.style.transform = 'scaleX(' + (total ? done.size / total : 0) + ')';
      }
      function revealCurrent() {
        const link = panels.left.querySelector('.toc-list a[aria-current="true"]');
        if (link && layout.dataset.left === 'open') link.scrollIntoView({ block: 'nearest' });
      }

      // ---------- 복습문제: 오른쪽 = 원문 · 힌트 · 풀이 ----------
      function setupReview() {
        const KEY = 'od-review-solved:' + RANGE;
        const cards = Array.from(document.querySelectorAll('main article.card'));
        const aids = panels.right.querySelector('.aids');
        const empty = panels.right.querySelector('.panel-empty');
        const btn = document.getElementById('solved-btn');
        const groups = {};
        const solved = new Set(tabStore.get(KEY, []).filter((id) => cards.some((c) => c.id === id)));
        cards.forEach((card) => {
          const g = document.createElement('div');
          g.className = 'aid';
          g.hidden = true;
          card.querySelectorAll(':scope > details').forEach((d) => g.appendChild(d));
          aids.appendChild(g);
          groups[card.id] = g;
        });
        let curId = null;
        function paintBtn() {
          const on = solved.has(curId);
          btn.setAttribute('aria-pressed', String(on));
          btn.innerHTML = (on ? ICON_DONE : ICON_TODO) + '<span>' + (on ? '푼 문제 · 표시 해제' : '푼 문제로 표시') + '</span>';
        }
        btn.addEventListener('click', () => {
          if (!curId) return;
          if (solved.has(curId)) solved.delete(curId); else solved.add(curId);
          tabStore.set(KEY, Array.from(solved));
          paintBtn();
          markToc(solved, cards.length, '푼 문제');
        });
        document.addEventListener('od:screen', (e) => {
          const s = e.detail.screen;
          curId = s.matches('article.card') ? s.id : null;
          Object.keys(groups).forEach((id) => { groups[id].hidden = id !== curId; });
          empty.hidden = Boolean(curId);
          btn.hidden = !curId;
          if (curId) paintBtn();
          panels.right.querySelector('.panel-inner').scrollTop = 0;
          markToc(solved, cards.length, '푼 문제');
          revealCurrent();
        });
      }

      // ---------- 정리노트: 오른쪽 = 페이지(토픽)별 요약 ----------
      function setupNote() {
        const KEY = 'od-note-read:' + RANGE;
        const topics = Array.from(document.querySelectorAll('main article.topic'));
        const read = new Set(store.get(KEY, []).filter((id) => topics.some((t) => t.id === id)));
        // 조각의 <div class="sum" hidden> 을 오른쪽 패널로 옮긴다. 없으면 안내 문구만 보인다.
        const box = panels.right.querySelector('.sums');
        const sums = {};
        topics.forEach((t) => {
          const el = t.querySelector(':scope > .sum');
          if (!el) return;
          el.hidden = true;
          box.appendChild(el);
          sums[t.id] = el;
        });
        const empty = document.getElementById('sum-empty');
        document.addEventListener('od:screen', (e) => {
          const s = e.detail.screen;
          const key = s.matches('article.topic') ? s.id : 'intro';
          Object.keys(sums).forEach((id) => { sums[id].hidden = id !== key; });
          empty.hidden = Boolean(sums[key]);
          if (s.matches('article.topic') && !read.has(s.id)) { read.add(s.id); store.set(KEY, Array.from(read)); }
          panels.right.querySelector('.panel-inner').scrollTop = 0;
          markToc(read, topics.length, '읽음');
          revealCurrent();
        });
      }

      if (kind === 'review') setupReview();
      if (kind === 'note') setupNote();
      sync();
    })();
  </script>
  <script id="pager-ui">
    (function () {
      const root = document.documentElement;
      const main = document.querySelector('main');
      const hero = main.querySelector('.hero');
      const screens = [hero].concat(Array.from(main.querySelectorAll(document.body.dataset.screens)));
      if (screens.length < 2) { root.classList.remove('js'); return; }
      screens.forEach((s) => s.classList.add('screen'));

      const last = screens.length - 1;
      const prevBtn = document.getElementById('pager-prev');
      const nextBtn = document.getElementById('pager-next');
      const count = document.getElementById('pager-count');
      const bar = document.getElementById('pager-bar');
      const status = document.getElementById('pager-status');
      const toc = document.querySelector('#panel-left .toc');
      const scroller = document.querySelector('.content');
      const titleOf = (s) => ((s.querySelector('h3') || s.querySelector('h1') || {}).textContent || '').trim();
      let cur = -1;

      // 목차: 섹션 링크 아래에 화면(토픽·카드) 목록을 붙인다
      const tocLinks = [];
      Array.from(toc.querySelectorAll(':scope > a')).forEach((a) => {
        const sec = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
        const group = document.createElement('div');
        group.className = 'toc-group';
        a.replaceWith(group);
        group.appendChild(a);
        if (!sec) return;
        const list = document.createElement('ol');
        list.className = 'toc-list';
        screens.forEach((s, i) => {
          if (!sec.contains(s)) return;
          const li = document.createElement('li');
          const link = document.createElement('a');
          link.href = '#' + s.id;
          link.innerHTML = '<span class="toc-title"></span>';
          link.firstChild.textContent = titleOf(s);
          li.appendChild(link);
          list.appendChild(li);
          tocLinks[i] = link;
        });
        group.appendChild(list);
      });

      function indexFor(hash) {
        const id = decodeURIComponent((hash || '').replace(/^#/, ''));
        const el = id && document.getElementById(id);
        if (!el || !main.contains(el)) return { i: 0 };
        const i = screens.findIndex((s) => s.contains(el) || el.contains(s));
        return { i: Math.max(i, 0), target: i >= 0 && screens[i].contains(el) && screens[i] !== el ? el : null };
      }

      function render(i, target) {
        const dir = cur < 0 ? '' : i > cur ? 'enter-next' : 'enter-prev';
        if (i !== cur) {
          if (cur >= 0) screens[cur].classList.remove('is-current', 'enter-next', 'enter-prev');
          main.querySelectorAll(':scope > section.is-on').forEach((sec) => sec.classList.remove('is-on'));
          const s = screens[i];
          const sec = s.closest('section');
          if (sec) sec.classList.add('is-on');
          s.classList.add('is-current');
          if (dir) { s.classList.remove('enter-next', 'enter-prev'); void s.offsetWidth; s.classList.add(dir); }
          cur = i;
          document.body.classList.toggle('at-end', i === last);
          prevBtn.disabled = i === 0;
          nextBtn.textContent = i === 0 ? '시작하기' : i === last ? '처음으로' : '다음';
          count.textContent = i === 0 ? '' : i + ' / ' + last;
          bar.style.transform = 'scaleX(' + (i / last) + ')';
          status.textContent = i === 0 ? titleOf(s) : i + ' / ' + last + ', ' + titleOf(s);
          tocLinks.forEach((link, k) => link && link.setAttribute('aria-current', String(k === i)));
          document.dispatchEvent(new CustomEvent('od:screen', { detail: { index: i, screen: s } }));
        }
        if (target) target.scrollIntoView({ block: 'start' });
        else scroller.scrollTo(0, 0);
      }

      function go(i) {
        i = Math.min(Math.max(i, 0), last);
        if (i === cur) return;
        const url = i === 0 ? location.pathname + location.search : '#' + screens[i].id;
        history.pushState(null, '', url);
        render(i);
      }

      prevBtn.addEventListener('click', () => go(cur - 1));
      nextBtn.addEventListener('click', () => go(cur === last ? 0 : cur + 1));
      const fromUrl = () => { const r = indexFor(location.hash); render(r.i, r.target); };
      window.addEventListener('hashchange', fromUrl);
      window.addEventListener('popstate', fromUrl);

      document.addEventListener('keydown', (e) => {
        if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey || document.body.classList.contains('drawer-open')) return;
        if (e.target.closest('input, select, textarea, [contenteditable="true"]')) return;
        if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
      });

      // 좌우로 밀어서 넘기기 (가로로 스크롤되는 영역은 제외)
      let sx = 0, sy = 0, skip = true;
      main.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        sx = t.clientX; sy = t.clientY;
        skip = e.touches.length > 1 || Boolean(e.target.closest('.widget, .katex-display, .table-wrap, svg, input, details'));
      }, { passive: true });
      main.addEventListener('touchend', (e) => {
        if (skip) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - sx, dy = t.clientY - sy;
        if (Math.abs(dx) > 64 && Math.abs(dx) > 2 * Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
      }, { passive: true });

      fromUrl();
    })();
  </script>
</body>
</html>
